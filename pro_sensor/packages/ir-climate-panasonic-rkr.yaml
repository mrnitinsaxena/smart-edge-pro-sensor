# Panasonic air conditioners (remote type RKR) - ESPHome's built-in panasonic_ir platform.
# Learns from the original remote through the IR receiver, so Home Assistant stays in sync.
climate:
  - platform: panasonic_ir
    name: Panasonic AC
    id: panasonic_ac
    model: RKR
    receiver_id: ir_receiver
    transmitter_id: ir_transmitter
    sensor: sensor_temperature
    icon: mdi:air-conditioner
    visual:
      min_temperature: 16 °C
      max_temperature: 30 °C
      temperature_step: 1.0 °C

select:
  - platform: panasonic_ir
    panasonic_ir_id: panasonic_ac
    vane_position:
      name: Panasonic AC vane position
      id: panasonic_ac_vane
