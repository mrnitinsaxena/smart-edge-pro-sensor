# Air conditioners - every IR platform built into ESPHome, one entry per remote model.
# Generated list: the user picks one under Configuration > AC remote in Home Assistant,
# and only that one is shown (see core-ir-ac-select.yaml). Units that support it learn
# from the original remote through the IR receiver, so Home Assistant stays in sync.
climate:
  - platform: airton            # Airton
    name: Airton AC
    id: ac_airton
    receiver_id: ir_receiver
    transmitter_id: ir_transmitter
    sensor: sensor_temperature
    icon: mdi:air-conditioner
