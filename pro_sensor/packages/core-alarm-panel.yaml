# Follows a Home Assistant alarm panel (default: Alarmo) and sounds the siren when it
# is triggered. Harmless if the entity doesn't exist. Disable with `alarm_panel: false`;
# point at another panel with `alarm_panel_entity`.
binary_sensor:
  - platform: template
    name: Home Alarm
    icon: mdi:home-lock
    id: external_alert
    device_class: safety
    lambda: |-
      return id(alarmo_state).has_state() &&
             id(alarmo_state).state == "triggered";

text_sensor:
  - platform: homeassistant
    id: alarmo_state
    entity_id: ${ alarm_panel_entity if alarm_panel_entity is defined and alarm_panel_entity != "" else "alarm_control_panel.alarmo" }
