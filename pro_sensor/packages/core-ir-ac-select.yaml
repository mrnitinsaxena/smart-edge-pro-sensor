              {"Panasonic DKE", id(ac_panasonic_dke_vane)},
              {"Panasonic JKE", id(ac_panasonic_jke)},
              {"Panasonic JKE", id(ac_panasonic_jke_vane)},
              {"Panasonic LKE", id(ac_panasonic_lke)},
              {"Panasonic LKE", id(ac_panasonic_lke_vane)},
              {"Panasonic NKE", id(ac_panasonic_nke)},
              {"Panasonic NKE", id(ac_panasonic_nke_vane)},
              {"Panasonic PKE", id(ac_panasonic_pke)},
              {"Panasonic PKE", id(ac_panasonic_pke_vane)},
