# Lets the user choose which air conditioner the IR blaster controls.
# Only the chosen remote's controls appear in Home Assistant; changing it
# restarts the device automatically to apply.
select:
  - platform: template
    name: AC remote
    id: ir_ac_brand
    icon: mdi:air-conditioner
    entity_category: config
    optimistic: true
    restore_value: true
    options:
      - "Not used"
      - "Airton"
      - "Ballu"
      - "Coolix"
      - "Daikin"
      - "Daikin ARC"
      - "Daikin BRC"
      - "Delonghi"
      - "Emmeti"
      - "Fujitsu General / O General"
      - "Gree Generic"
      - "Gree YAA"
      - "Gree YAC"
      - "Gree YAC1FB9"
      - "Gree YAG"
      - "Gree YAN"
      - "Gree YAW1F"
      - "Gree YB1FA"
      - "Gree YX1FF"
      - "Haier Tundra"
      - "Hitachi AC344"
      - "Hitachi AC424"
      - "LG"
      - "Midea"
      - "Mistral"
      - "Mitsubishi"
      - "Noblex"
      - "Panasonic CKP"
      - "Panasonic DKE"
      - "Panasonic JKE"
      - "Panasonic LKE"
      - "Panasonic NKE"
      - "Panasonic PKE"
      - "Panasonic RKR"
      - "Pioneer (Parker Davis)"
      - "Remko / Trotec"
      - "Samsung"
      - "Siemens IRA211"
      - "TCL / Electrolux"
      - "Toshiba Generic"
      - "Toshiba RAC-PT1411HWRU-C"
      - "Toshiba RAC-PT1411HWRU-F"
      - "Toshiba RAS-25J2KVSG-ND"
      - "Toshiba RAS-2819T"
      - "Toshiba RAS-B10N3KV2"
      - "Toshiba Seiya"
      - "Whirlpool DG11J1-3A"
      - "Whirlpool DG11J1-91"
      - "Whynter"
      - "Yashima"
      - "ZH/LT-01"
    initial_option: "Not used"
    on_value:
      - script.execute: restart_to_apply

esphome:
  on_boot:
    - priority: 600
      then:
        - lambda: |-
            const auto selected = id(ir_ac_brand).current_option();
            struct AcEntity { const char *option; EntityBase *entity; };
            const AcEntity entities[] = {
              {"Airton", id(ac_airton)},
              {"Ballu", id(ac_ballu)},
              {"Coolix", id(ac_coolix)},
              {"Daikin", id(ac_daikin)},
              {"Daikin ARC", id(ac_daikin_arc)},
              {"Daikin BRC", id(ac_daikin_brc)},
              {"Delonghi", id(ac_delonghi)},
              {"Emmeti", id(ac_emmeti)},
              {"Fujitsu General / O General", id(ac_fujitsu_general)},
              {"Gree Generic", id(ac_gree_generic)},
              {"Gree YAA", id(ac_gree_yaa)},
              {"Gree YAC", id(ac_gree_yac)},
              {"Gree YAC1FB9", id(ac_gree_yac1fb9)},
              {"Gree YAG", id(ac_gree_yag)},
              {"Gree YAN", id(ac_gree_yan)},
              {"Gree YAW1F", id(ac_gree_yaw1f)},
              {"Gree YB1FA", id(ac_gree_yb1fa)},
              {"Gree YX1FF", id(ac_gree_yx1ff)},
              {"Haier Tundra", id(ac_haier_tundra)},
              {"Hitachi AC344", id(ac_hitachi_ac344)},
              {"Hitachi AC424", id(ac_hitachi_ac424)},
              {"LG", id(ac_lg)},
              {"Midea", id(ac_midea)},
              {"Mistral", id(ac_mistral)},
              {"Mitsubishi", id(ac_mitsubishi)},
              {"Noblex", id(ac_noblex)},
