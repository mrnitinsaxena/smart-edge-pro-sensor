              {"Siemens IRA211", id(ac_siemens_ira211)},
              {"TCL / Electrolux", id(ac_tcl)},
              {"Toshiba Generic", id(ac_toshiba_generic)},
              {"Toshiba RAC-PT1411HWRU-C", id(ac_toshiba_rac_pt1411hwru_c)},
