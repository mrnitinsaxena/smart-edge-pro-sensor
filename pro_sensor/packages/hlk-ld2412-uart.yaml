# Default values; override per include with `vars:` if needed.
defaults:
  uart_id: "uart_bus_hlk_ld2412"
  ld2412_id: "hlk_ld2412"
  ld2412_prefix: "HLK-LD2412 "

uart:
  - id: ${uart_id}
    rx_pin: ${RADAR1_RX1_PIN}
    tx_pin: ${RADAR1_TX1_PIN}
    baud_rate: 115200
    parity: NONE
    stop_bits: 1

ld2412:
  - id: ${ld2412_id}
    uart_id: ${uart_id}

binary_sensor:
  - platform: ld2412
    ld2412_id: ${ld2412_id}
